name: 'Bug report'
description: 'Report a defect in SynchronicityEngine'
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 'Provide as much detail as possible.'
  - type: input
    id: summary
    attributes:
      label: 'Summary'
      placeholder: 'Concise description of the issue'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 'Steps to reproduce'
      description: 'List the steps to trigger the issue'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 'Expected behaviour'
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 'Actual behaviour'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 'Logs and diagnostics'
      render: shell
